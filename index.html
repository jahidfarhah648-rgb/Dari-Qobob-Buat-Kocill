<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Permintaan Maaf dari Presiden PKS</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f0f0;
            padding: 20px;
        }
        .apology-message {
            font-size: 24px;
            margin: 20px 0;
            color: #333;
        }
        .minion {
            width: 200px;
            height: 200px;
            background-image: url('https://example.com/minion-bob.png'); /* Ganti dengan URL gambar Minion Bob yang valid */
            background-size: cover;
            margin: 20px auto;
            animation: bob 2s infinite;
        }
        @keyframes bob {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        .drive-link {
            margin-top: 20px;
        }
        a {
            color: #007bff;
            text-decoration: none;
            font-size: 18px;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>Permintaan Maaf Resmi</h1>
    <div class="apology-message">
        <p>Dari Presiden PKS, Muhammad Qais Nashrullah, kepada Shofura Izzati:</p>
        <p>Saya mohon maaf atas segala kesalahpahaman dan ketidaknyamanan yang telah terjadi. Mari kita bersama-sama membangun kebaikan.</p>
    </div>
    <div class="minion"></div>
    <div class="drive-link">
        <p>Untuk detail lebih lanjut, silakan buka:</p>
        <a href="https://drive.google.com" target="_blank">Google Drive</a>
    </div>
</body>
</html>
